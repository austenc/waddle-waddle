<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Ducks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="splash">
      <div class="splash-veil"></div>
      <div class="splash-panel">
        <p class="splash-eyebrow">you are a mallard</p>
        <h1 class="splash-title">DUCKS</h1>
        <p class="splash-tag">Waddle the park. Take flight. Quack without shame.</p>
        <button type="button" id="start-btn" class="splash-btn">Start waddling</button>
        <p class="splash-enter">or press Enter · tap on phones</p>
      </div>
    </div>

    <div id="hud" class="hud-hidden" aria-hidden="true">
      <div class="brand">DUCKS</div>
      <div class="hint hint-desktop">WASD · Space hop · double-jump fly · H / Shift honk · E/Q climb</div>
      <div class="hint hint-mobile">Stick · JUMP ×2 to fly · UP/DN · ROLL · HONK</div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
